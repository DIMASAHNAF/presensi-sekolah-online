<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#051c1b"/>
    </linearGradient>

    <!-- Emerald-Cyan Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(20, 184, 166, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanMove {
      0% { transform: translateY(0px); opacity: 0.2; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(150px); opacity: 0.2; }
    }
    @keyframes pulseRing {
      0% { r: 6; opacity: 0.9; stroke-width: 2; }
      100% { r: 42; opacity: 0; stroke-width: 1; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes textGlow {
      0%, 100% { fill: #34d399; }
      50% { fill: #38bdf8; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .laser-line {
      animation: scanMove 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .radar-beam {
      transform-origin: 730px 145px;
      animation: radarRotate 4s linear infinite;
    }
    .pulse-wave-1 {
      animation: pulseRing 2.4s ease-out infinite;
    }
    .pulse-wave-2 {
      animation: pulseRing 2.4s ease-out 1.2s infinite;
    }
    .landmark {
      transform-origin: center;
      animation: blinkDot 1.8s ease-in-out infinite;
    }
    .mono-tech {
      font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, monospace;
    }
    .sans-tech {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="290" rx="18" fill="url(#bgGrad)" stroke="#1e3a47" stroke-width="1.5"/>
  <rect width="900" height="290" rx="18" fill="url(#techGrid)"/>

  <!-- Outer Neon Border Accents -->
  <path d="M 18 45 L 18 18 L 45 18" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 855 18 L 882 18 L 882 45" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 18 245 L 18 272 L 45 272" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 855 272 L 882 272 L 882 245" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Header Status Pill -->
  <g transform="translate(40, 30)">
    <rect width="180" height="26" rx="13" fill="#0f2628" stroke="#134e4a" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#10b981" filter="url(#glow)"/>
    <circle cx="15" cy="13" r="2.5" fill="#ecfdf5"/>
    <text x="28" y="17" fill="#6ee7b7" class="mono-tech" font-size="10.5" font-weight="700" letter-spacing="1">SYSTEM READY • 60 FPS</text>
  </g>

  <!-- System Subtitle Top Center -->
  <g transform="translate(450, 42)" text-anchor="middle">
    <text class="sans-tech" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2.5">NEXT-GEN BIOMETRIC ATTENDANCE</text>
    <text class="sans-tech" font-size="18" font-weight="800" fill="#ffffff" y="24" letter-spacing="0.5">FACE ID &amp; GPS GEOFENCING PROTOCOL</text>
  </g>

  <!-- ================= LEFT PANEL: FACE SCANNER HUD ================= -->
  <g transform="translate(60, 75)">
    <!-- Scanner Box / HUD Frame -->
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#08141e" stroke="#164e63" stroke-width="1.2"/>
    <rect x="5" y="5" width="150" height="165" rx="10" fill="none" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.4"/>

    <!-- Corner Brackets for Face Scanner -->
    <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 132 12 L 148 12 L 148 28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 147 L 12 163 L 28 163" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 132 163 L 148 163 L 148 147" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Stylized Face Wireframe Vector -->
    <g transform="translate(80, 87.5)" stroke="#14b8a6" fill="none" stroke-width="1.2" opacity="0.85">
      <!-- Head Contour / Oval -->
      <ellipse cx="0" cy="-2" rx="38" ry="50" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="140 10"/>
      <!-- Eye Region Mesh -->
      <path d="M -24 -10 Q -14 -16 -4 -10 M 4 -10 Q 14 -16 24 -10" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="-14" cy="-8" rx="4.5" ry="3.5" fill="#06b6d4" opacity="0.4"/>
      <ellipse cx="14" cy="-8" rx="4.5" ry="3.5" fill="#06b6d4" opacity="0.4"/>
      <!-- Nose Bridge -->
      <path d="M 0 -10 L -2 10 L 4 12" stroke="#2dd4bf"/>
      <!-- Mouth Contour -->
      <path d="M -14 26 Q 0 34 14 26" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Jawline Mesh Points -->
      <circle cx="-14" cy="-8" r="2.5" fill="#38bdf8" class="landmark" style="animation-delay: 0.1s;"/>
      <circle cx="14" cy="-8" r="2.5" fill="#38bdf8" class="landmark" style="animation-delay: 0.3s;"/>
      <circle cx="0" cy="12" r="2.5" fill="#34d399" class="landmark" style="animation-delay: 0.5s;"/>
      <circle cx="-14" cy="26" r="2" fill="#38bdf8" class="landmark" style="animation-delay: 0.7s;"/>
      <circle cx="14" cy="26" r="2" fill="#38bdf8" class="landmark" style="animation-delay: 0.9s;"/>
      <circle cx="0" cy="-35" r="2" fill="#34d399" class="landmark" style="animation-delay: 1.1s;"/>
      <!-- Center Reticle Cross -->
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#ef4444" stroke-width="1" opacity="0.7"/>
      <line x1="0" y1="-10" x2="0" y2="6" stroke="#ef4444" stroke-width="1" opacity="0.7"/>
    </g>

    <!-- Active Laser Scan Beam Moving Up & Down -->
    <g class="laser-line">
      <rect x="8" y="10" width="144" height="4" rx="2" fill="url(#laserGrad)" filter="url(#glow)"/>
      <line x1="12" y1="12" x2="148" y2="12" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
    </g>

    <!-- Scan Status Footer -->
    <rect x="15" y="146" width="130" height="20" rx="5" fill="#042f2e" opacity="0.9"/>
    <text x="80" y="160" class="mono-tech" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="0.5">
      AI FACE MATCH 99.4%
    </text>
  </g>

  <!-- ================= CENTER PANEL: ARCHITECTURE METRICS ================= -->
  <g transform="translate(245, 80)">
    <!-- Feature 1: Biometric Embedding -->
    <g transform="translate(0, 0)">
      <rect width="215" height="48" rx="8" fill="#0b1728" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#0369a1" fill-opacity="0.25"/>
      <path d="M 18 24 L 23 29 L 31 19" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="48" y="20" class="sans-tech" font-size="12" font-weight="700" fill="#ffffff">128-D Face Vector</text>
      <text x="48" y="36" class="mono-tech" font-size="9.5" fill="#94a3b8">dlib ResNet • Dist &lt; 0.45</text>
    </g>

    <!-- Feature 2: GPS Geofencing Radius -->
    <g transform="translate(0, 56)">
      <rect width="215" height="48" rx="8" fill="#0b1728" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#047857" fill-opacity="0.25"/>
      <circle cx="24" cy="24" r="5" fill="#10b981"/>
      <circle cx="24" cy="24" r="9" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <text x="48" y="20" class="sans-tech" font-size="12" font-weight="700" fill="#ffffff">GPS Haversine Radius</text>
      <text x="48" y="36" class="mono-tech" font-size="9.5" fill="#94a3b8">Radius Kunci: 100 Meter</text>
    </g>

    <!-- Feature 3: Live Auto-Sync Polling -->
    <g transform="translate(0, 112)">
      <rect width="215" height="48" rx="8" fill="#0b1728" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#6d28d9" fill-opacity="0.25"/>
      <path d="M 21 17 L 27 24 L 21 31" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <path d="M 27 17 L 21 24 L 27 31" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      <text x="48" y="20" class="sans-tech" font-size="12" font-weight="700" fill="#ffffff">Realtime 2s Auto-Sync</text>
      <text x="48" y="36" class="mono-tech" font-size="9.5" fill="#94a3b8">Zero-Reload Live DOM</text>
    </g>

    <!-- Animated Data Connector Line -->
    <path d="M 215 24 L 245 24 M 215 80 L 245 80 M 215 136 L 245 136" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- ================= RIGHT PANEL: RADAR & VERIFICATION ================= -->
  <g transform="translate(510, 80)">
    <!-- Card Container -->
    <rect width="345" height="165" rx="12" fill="#07131e" stroke="#164e63" stroke-width="1.2"/>

    <!-- Left inside: Geofence Radar Circle -->
    <g transform="translate(85, 82.5)">
      <!-- Outer Distance Rings -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#155e75" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#0e7490" stroke-width="1"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#0d9488" stroke-width="1"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#10b981" stroke-width="1"/>

      <!-- Crosshairs -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#164e63" stroke-width="0.8"/>
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#164e63" stroke-width="0.8"/>

      <!-- Radar Pulse Waves -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#34d399" class="pulse-wave-1"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="pulse-wave-2"/>

      <!-- Rotating Radar Beam -->
      <g style="transform-origin: 0px 0px; animation: radarRotate 3.5s linear infinite;">
        <path d="M 0 0 L 50 -35 A 65 65 0 0 1 65 0 Z" fill="url(#radarSweep)"/>
        <line x1="0" y1="0" x2="65" y2="0" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
      </g>

      <!-- Center Pin (School Location) -->
      <circle cx="0" cy="0" r="4.5" fill="#10b981" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>

      <!-- Target Student Dot (Inside Radius) -->
      <g transform="translate(18, -14)">
        <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      </g>
    </g>

    <!-- Right inside: Telemetry readout -->
    <g transform="translate(170, 24)">
      <!-- Geofence Status -->
      <rect width="155" height="24" rx="6" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#34d399" filter="url(#glow)"/>
      <text x="24" y="16" class="mono-tech" font-size="9" font-weight="700" fill="#a7f3d0">RADIUS: VERIFIED (42m)</text>

      <!-- Student Card Detail -->
      <text x="2" y="44" class="sans-tech" font-size="11" font-weight="700" fill="#ffffff">Ahmad Fauzi (XII RPL 1)</text>
      <text x="2" y="60" class="mono-tech" font-size="9" fill="#94a3b8">NISN: 0089218291</text>
      <text x="2" y="74" class="mono-tech" font-size="9" fill="#94a3b8">Timestamp: 07:12:44 WIB</text>

      <!-- Big Success Tag -->
      <rect x="0" y="86" width="155" height="34" rx="8" fill="url(#badgeGrad)" filter="url(#glow)"/>
      <text x="77" y="107" class="sans-tech" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ✓ HADIR (TERCATAT)
      </text>
    </g>
  </g>
</svg>
