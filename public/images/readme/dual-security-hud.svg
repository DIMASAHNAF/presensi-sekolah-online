<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091824"/>
      <stop offset="100%" stop-color="#061219"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08231c"/>
      <stop offset="100%" stop-color="#051512"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15122e"/>
      <stop offset="100%" stop-color="#090818"/>
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes hudBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes scanLineCard {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(90px); opacity: 0; }
    }
    @keyframes pulseCircle {
      0% { r: 10; opacity: 0.8; }
      100% { r: 35; opacity: 0; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }
    .hud-scan {
      animation: scanLineCard 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .hud-pulse {
      animation: pulseCircle 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .heartbeat-icon {
      transform-origin: 795px 65px;
      animation: heartbeat 2.5s ease-in-out infinite;
    }
    .tech-mono {
      font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, monospace;
    }
    .tech-sans {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- CARD 1: FACE ID BIOMETRICS -->
  <g transform="translate(10, 10)">
    <rect width="285" height="230" rx="14" fill="url(#cardGrad1)" stroke="#0e7490" stroke-width="1.2"/>
    
    <!-- Header -->
    <circle cx="28" cy="30" r="14" fill="#0891b2" fill-opacity="0.2"/>
    <path d="M 22 26 A 6 6 0 0 1 34 26 C 34 32 28 35 28 35 C 28 35 22 32 22 26 Z" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="28" cy="27" r="1.5" fill="#38bdf8"/>
    <text x="50" y="27" class="tech-sans" font-size="13" font-weight="700" fill="#ffffff">Face ID Recognition</text>
    <text x="50" y="41" class="tech-mono" font-size="9" fill="#38bdf8">128-D VECTOR EMBEDDING</text>

    <!-- Scanner Mini Visual -->
    <rect x="20" y="58" width="245" height="100" rx="8" fill="#041018" stroke="#164e63" stroke-dasharray="4 4"/>
    
    <!-- Face Silhouette / Mesh in Mini Visual -->
    <ellipse cx="142" cy="108" rx="26" ry="34" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
    <circle cx="134" cy="102" r="2.5" fill="#38bdf8"/>
    <circle cx="150" cy="102" r="2.5" fill="#38bdf8"/>
    <path d="M 137 122 Q 142 127 147 122" stroke="#22d3ee" stroke-width="1.5" fill="none"/>

    <!-- Scanning Line -->
    <g class="hud-scan">
      <rect x="24" y="62" width="237" height="3" fill="url(#pulseCyan)" filter="url(#neonBlur)"/>
      <line x1="24" y1="63" x2="261" y2="63" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- Metrics Footer -->
    <g transform="translate(20, 172)">
      <rect width="245" height="46" rx="8" fill="#081e2b" stroke="#155e75" stroke-width="0.8"/>
      <text x="12" y="19" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Confidence Threshold</text>
      <text x="233" y="19" class="tech-mono" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">≤ 0.45 Dist</text>
      <text x="12" y="36" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Anti-Spoofing / Multi-Angle</text>
      <text x="233" y="36" class="tech-mono" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="end">3-5 Angle Min</text>
    </g>
  </g>

  <!-- CARD 2: GPS GEOFENCING -->
  <g transform="translate(315, 10)">
    <rect width="285" height="230" rx="14" fill="url(#cardGrad2)" stroke="#059669" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="28" cy="30" r="14" fill="#059669" fill-opacity="0.2"/>
    <circle cx="28" cy="30" r="5" fill="#10b981"/>
    <circle cx="28" cy="30" r="10" fill="none" stroke="#10b981" stroke-width="1.4"/>
    <text x="50" y="27" class="tech-sans" font-size="13" font-weight="700" fill="#ffffff">GPS Geofencing Lock</text>
    <text x="50" y="41" class="tech-mono" font-size="9" fill="#34d399">HAVERSINE RADIUS ENGINE</text>

    <!-- Radar Mini Visual -->
    <rect x="20" y="58" width="245" height="100" rx="8" fill="#021a14" stroke="#065f46" stroke-dasharray="4 4"/>

    <!-- Radar Target Visual -->
    <g transform="translate(142, 108)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4 3"/>
      <circle cx="0" cy="0" r="24" fill="#059669" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#34d399" class="hud-pulse"/>
      <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#neonBlur)"/>
      <!-- Student inside radar pin -->
      <circle cx="10" cy="-8" r="3.5" fill="#38bdf8"/>
      <text x="17" y="-5" class="tech-mono" font-size="8" fill="#a7f3d0">38m</text>
    </g>

    <!-- Metrics Footer -->
    <g transform="translate(20, 172)">
      <rect width="245" height="46" rx="8" fill="#042820" stroke="#065f46" stroke-width="0.8"/>
      <text x="12" y="19" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Batas Toleransi Radius</text>
      <text x="233" y="19" class="tech-mono" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">100 Meter</text>
      <text x="12" y="36" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Auto-Reject Outside Radius</text>
      <text x="233" y="36" class="tech-mono" font-size="10" font-weight="700" fill="#4ade80" text-anchor="end">ACTIVE 🔒</text>
    </g>
  </g>

  <!-- CARD 3: REALTIME LIVE SYNC -->
  <g transform="translate(620, 10)">
    <rect width="285" height="230" rx="14" fill="url(#cardGrad3)" stroke="#7c3aed" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="28" cy="30" r="14" fill="#7c3aed" fill-opacity="0.2"/>
    <path d="M 23 25 L 29 30 L 23 35" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="27" class="tech-sans" font-size="13" font-weight="700" fill="#ffffff">Realtime Live Sync</text>
    <text x="50" y="41" class="tech-mono" font-size="9" fill="#c084fc">ZERO-RELOAD DOM UPDATE</text>

    <!-- Pulse Wave Mini Visual -->
    <rect x="20" y="58" width="245" height="100" rx="8" fill="#0d0b21" stroke="#4c1d95" stroke-dasharray="4 4"/>

    <!-- Live Telemetry Graph Animation -->
    <g transform="translate(35, 110)">
      <path d="M 0 0 L 35 0 L 45 -22 L 55 24 L 65 -12 L 75 14 L 85 0 L 140 0 L 150 -18 L 160 16 L 170 0 L 210 0" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <circle cx="170" cy="0" r="4" fill="#c084fc" filter="url(#neonBlur)"/>
      <!-- Heartbeat icon -->
      <circle cx="102" cy="-28" r="4.5" fill="#34d399"/>
      <text x="114" y="-24" class="tech-mono" font-size="9" font-weight="700" fill="#34d399">SYNC: 2.0s</text>
    </g>

    <!-- Metrics Footer -->
    <g transform="translate(20, 172)">
      <rect width="245" height="46" rx="8" fill="#171238" stroke="#4c1d95" stroke-width="0.8"/>
      <text x="12" y="19" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Polling Latency</text>
      <text x="233" y="19" class="tech-mono" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="end">2000 ms</text>
      <text x="12" y="36" class="tech-sans" font-size="10" font-weight="600" fill="#94a3b8">Statistik Kelas &amp; Mapel</text>
      <text x="233" y="36" class="tech-mono" font-size="10" font-weight="700" fill="#34d399" text-anchor="end">Instant Pulse</text>
    </g>
  </g>
</svg>
